name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 */6 * *' # Runs every 6 days at midnight UTC
  workflow_dispatch:      # Allows manual triggering from the Actions tab

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive Table
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          curl -X POST "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/keep_alive" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\": 1, \"last_ping\": \"$TIMESTAMP\"}"
