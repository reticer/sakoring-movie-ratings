name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 */6 * *' # Runs every 6 days at midnight UTC
  workflow_dispatch:      # Allows manual triggering from the Actions tab

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive Table
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -f -i -X PATCH "${SUPABASE_URL}/rest/v1/keep_alive?id=eq.1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"last_ping": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'
