<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Full Bleed Background (NO transparent edges, NO rx/ry rounded corners) -->
  <rect width="100%" height="100%" fill="#0b0f19" />
  
  <g transform="translate(96, 120)">
    <!-- Clapperboard Lower Half -->
    <rect x="0" y="70" width="320" height="210" fill="#1e293b" rx="20" stroke="#334155" stroke-width="4" />
    
    <!-- Clapperboard Bottom Bar -->
    <path d="M0 70 L320 70 L320 110 L0 110 Z" fill="#0f172a" />
    <path d="M40 70 L80 70 L60 110 L20 110 Z" fill="#ffffff" opacity="0.9" />
    <path d="M120 70 L160 70 L140 110 L100 110 Z" fill="#ffffff" opacity="0.9" />
    <path d="M200 70 L240 70 L220 110 L180 110 Z" fill="#ffffff" opacity="0.9" />
    <path d="M280 70 L320 70 L300 110 L260 110 Z" fill="#ffffff" opacity="0.9" />
    
    <!-- Clapperboard Top Hinge (Angled up) -->
    <g transform="rotate(-18 0 70)">
      <path d="M0 30 L320 30 L320 70 L0 70 Z" fill="#E50914" />
      <path d="M40 30 L80 30 L60 70 L20 70 Z" fill="#ffffff" opacity="0.9" />
      <path d="M120 30 L160 30 L140 70 L100 70 Z" fill="#ffffff" opacity="0.9" />
      <path d="M200 30 L240 30 L220 70 L180 70 Z" fill="#ffffff" opacity="0.9" />
      <path d="M280 30 L320 30 L300 70 L260 70 Z" fill="#ffffff" opacity="0.9" />
      <circle cx="16" cy="50" r="6" fill="#94a3b8" />
    </g>
    
    <!-- Glowing Star in Center -->
    <g transform="translate(160, 185) scale(1.6)" filter="url(#glow)">
      <path d="M 0 -22 L 6 -7 L 22 -4 L 10 7 L 13 22 L 0 15 L -13 22 L -10 7 L -22 -4 L -6 -7 Z" fill="#F59E0B" />
    </g>
  </g>
</svg>
